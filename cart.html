<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات - دكان الحرمين</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;800&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-glow: rgba(140, 180, 255, 0.3);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --bg-deep: #020617;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Abstract Fluid Background */
        .fluid-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, #1e1b4b 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, #1e293b 0%, transparent 40%);
            filter: blur(80px);
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            opacity: 0.15;
            animation: move 25s infinite alternate ease-in-out;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%) rotate(0deg); }
            to { transform: translate(20%, 30%) rotate(360deg); }
        }

        /* Nav */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 4rem;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-main);
        }

        .nav-links {
            display: flex;
            gap: 3rem;
        }

        .nav-links a {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-sub);
            text-decoration: none;
            letter-spacing: 0.1em;
            transition: color 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: white;
        }

        /* Main Content */
        main {
            padding: 0 4rem;
            max-width: 1400px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            text-align: center;
            margin-top: 2rem;
        }

        .cart-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 2rem;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            margin-top: 2rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .item-image {
            font-size: 2rem;
        }

        .item-details h3 {
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
        }

        .item-details p {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .btn-remove {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-remove:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .cart-summary {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: #4ade80;
        }

        .btn-checkout {
            padding: 1rem 2rem;
            border-radius: 15px;
            border: none;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            color: white;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-checkout:hover {
            transform: scale(0.98);
            filter: brightness(1.1);
        }

        /* Animations */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            animation: revealAnim 1s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes revealAnim {
            to { opacity: 1; transform: translateY(0); }
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-sub);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="fluid-canvas">
        <div class="blob"></div>
    </div>

    <nav class="reveal">
        <a href="AlfadilStore.html" class="logo">دكان الحرمين</a>
        <div class="nav-links">
            <a href="categories.html">الأصناف</a>
            <a href="cart.html" class="active">السلة <span id="cartCount">(0)</span></a>
            <a href="#">العروض </a>
            <a href="register.html" id="authLink">التسجيل</a>
        </div>
    </nav>

    <main>
        <h1 class="reveal delay-1">سلة المشتريات</h1>
        
        <div class="cart-container reveal delay-2" id="cartContainer">
            <!-- Cart items will be loaded here -->
        </div>

        <div class="cart-summary reveal delay-2" id="cartSummary" style="display: none;">
            <div class="total-price">الإجمالي: <span id="totalAmount">0</span> SDG</div>
            <button class="btn-checkout" onclick="placeOrder()">إتمام الطلب</button>
        </div>
    </main>

    <footer>© 2026 Created by Minna Service Sudan</footer>

    <script src="db.js"></script>
    <script>
        // Check auth status
        const currentUser = db.getCurrentUser();
        const authLink = document.getElementById('authLink');
        
        if (currentUser) {
            authLink.textContent = 'تسجيل خروج';
            authLink.href = '#';
            authLink.onclick = (e) => {
                e.preventDefault();
                db.logoutUser();
            };
            
            document.getElementById('cartCount').textContent = `(${currentUser.cart.length})`;
            loadCart();
        } else {
            window.location.href = 'login.html';
        }

        function loadCart() {
            const cartContainer = document.getElementById('cartContainer');
            const cartSummary = document.getElementById('cartSummary');
            const cart = db.getCart();

            if (cart.length === 0) {
                cartContainer.innerHTML = '<p style="text-align: center; color: var(--text-sub);">السلة فارغة</p>';
                cartSummary.style.display = 'none';
                return;
            }

            cartSummary.style.display = 'flex';
            cartContainer.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                const itemEl = document.createElement('div');
                itemEl.className = 'cart-item';
                itemEl.innerHTML = `
                    <div class="item-info">
                        <span class="item-image">${item.image}</span>
                        <div class="item-details">
                            <h3>${item.name}</h3>
                            <p>${item.price} SDG × ${item.quantity}</p>
                        </div>
                    </div>
                    <div class="item-actions">
                        <span style="color: #4ade80; font-weight: bold;">${itemTotal} SDG</span>
                        <button class="btn-remove" onclick="removeFromCart(${item.productId})">حذف</button>
                    </div>
                `;
                cartContainer.appendChild(itemEl);
            });

            document.getElementById('totalAmount').textContent = total;
        }

        function removeFromCart(productId) {
            if (db.removeFromCart(productId)) {
                loadCart();
                const user = db.getCurrentUser();
                document.getElementById('cartCount').textContent = `(${user.cart.length})`;
            }
        }

        function placeOrder() {
            const result = db.placeOrder();
            if (result.success) {
                alert(result.message);
                loadCart();
                document.getElementById('cartCount').textContent = '(0)';
            } else {
                alert(result.message);
            }
        }
    </script>

</body>
</html>
